name: Build Debug APK

# Baut eine installierbare, aber UNSIGNIERTE Debug-APK (Android-Standard-
# Debug-Keystore) zum direkten Installieren auf einem eigenen Gerät. Kein
# Ersatz für einen signierten Release-Build (siehe README, Abschnitt
# "Release-Signing") - Debug-Builds sind nicht für den Play Store gedacht.
#
# Grund fuer diesen Workflow: In der Entwicklungsumgebung, in der dieses
# Projekt entstanden ist, sind die Android-SDK-Download-Server von Google
# ueber eine Netzwerk-Policy blockiert, ein lokaler Gradle-Build war dort
# nicht moeglich. GitHub-Actions-Runner haben regulaeren Internetzugang.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/wecker-ortswecker-android-33b5nl
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-debug-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform/build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wecker-ortswecker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
