name: Build Signed Release AAB

# Baut ein signiertes Android App Bundle (.aab) zur Veröffentlichung im
# Play Store. Nur manuell auslösbar (workflow_dispatch), NICHT bei jedem
# Push - ein Release-Build ist eine bewusste Aktion, kein Nebenprodukt
# jeder Änderung.
#
# Der Signing-Key selbst liegt NIEMALS im Repo (siehe android/.gitignore
# und README, Abschnitt "Release-Signing"). Er wird stattdessen als
# GitHub Actions Secret (base64-kodiert) bereitgestellt und nur zur
# Laufzeit dieses Workflows aus dem Secret rekonstruiert - siehe README,
# Abschnitt "Signierten Release-Build über GitHub Actions bauen" für die
# genaue Einrichtung der benötigten Repository-Secrets.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform/build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore signing keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ist nicht gesetzt - siehe README, Abschnitt 'Signierten Release-Build über GitHub Actions bauen'."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Write keystore.properties
        env:
          ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$ANDROID_KEYSTORE_STORE_PASSWORD
          keyAlias=$ANDROID_KEYSTORE_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_KEY_PASSWORD
          EOF

      - name: Build signed release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" android/keystore.properties

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wecker-ortswecker-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
