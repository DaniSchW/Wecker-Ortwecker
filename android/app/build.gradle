apply plugin: 'com.android.application'

// Release-Signing: Zugangsdaten kommen bewusst NIE ins Repo. Lokal/CI wird
// android/keystore.properties (git-ignoriert) erwartet - siehe
// keystore.properties.example und README, Abschnitt "Release-Signing".
// Ohne diese Datei bleibt der release-Build unsigniert (z.B. für reine
// Kompilier-/Lint-Checks in CI ohne Store-Veröffentlichung).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "app.weckerundort.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.weckerundort.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // WICHTIG: versionCode vor JEDEM neuen signierten .aab-Build (auch
        // ohne inhaltliche Änderung) um mindestens 1 erhöhen - die Play
        // Console lehnt sonst den Upload ab. versionName nur bei einem
        // tatsächlichen inhaltlichen Release mitziehen, nicht bei jedem
        // Build.
        versionCode 3
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            // minifyEnabled bewusst aus: R8/ProGuard kann Reflection-basierten
            // Native-Plugin-Code (Capacitor-Plugins registrieren Klassen u.a.
            // über Reflection) ohne sorgfältig getestete, plugin-spezifische
            // Keep-Regeln brechen. Da hier kein Android-Build/Gerät zum
            // Verifizieren zur Verfügung steht, ist "funktioniert garantiert"
            // wichtiger als eine kleinere APK - siehe README.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    // Explizit (nicht nur transitiv über Plugin-Module) für NotificationCompat/
    // NotificationManagerCompat/ServiceCompat im Vollbild-Alarm-Code
    // (AlarmNotifier/AlarmRingService) - "implementation" bei anderen
    // Modulen ist nicht zwingend nach außen sichtbar.
    implementation "androidx.core:core:$androidxCoreVersion"
    // Ebenfalls explizit: @capgo/background-geolocation deklariert dies nur
    // als eigenes "implementation" (also nicht transitiv sichtbar), wird
    // aber von WeckerOrtsweckerApplication.java für den rein nativen
    // Geofence-Empfänger benötigt (Vollbild-Alarm-Ergänzung).
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Pro-Abo (werbefrei), siehe BillingBridgePlugin.java - direkter
    // Play-Billing-Wrapper ohne Drittanbieter-SDK.
    implementation "com.android.billingclient:billing:$billingClientVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
