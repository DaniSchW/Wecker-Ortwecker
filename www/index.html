<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Wecker & Ortswecker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 data-i18n="app.name">Wecker & Ortswecker</h1>
    </header>

    <main class="tab-content">
      <section id="tab-alarm" class="tab-panel is-active">
        <div class="tile-grid">
          <div class="empty-state" data-i18n="alarm.empty">Noch keine Wecker. Tippe auf + zum Hinzufügen.</div>
          <button type="button" class="tile tile-add" data-i18n-aria-label="alarm.add">+</button>
        </div>
      </section>

      <section id="tab-location-alarm" class="tab-panel">
        <div class="tile-grid">
          <div class="empty-state" data-i18n="locationAlarm.empty">Noch keine Orts-Zeit-Wecker. Tippe auf + zum Hinzufügen.</div>
          <button type="button" class="tile tile-add" data-i18n-aria-label="locationAlarm.add">+</button>
        </div>
      </section>

      <section id="tab-stopwatch" class="tab-panel">
        <div class="stopwatch">
          <div class="stopwatch-ring">
            <svg viewBox="0 0 100 100">
              <circle class="ring-track" cx="50" cy="50" r="45"></circle>
              <circle class="ring-progress" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="283"></circle>
            </svg>
            <div class="stopwatch-time">00:00.00</div>
          </div>
          <div class="stopwatch-controls">
            <button type="button" class="btn-round secondary" data-i18n="stopwatch.lap">Runde</button>
            <button type="button" class="btn-round primary" data-i18n="stopwatch.start">Start</button>
          </div>
          <ul class="lap-list">
            <li class="empty-state" data-i18n="stopwatch.noLaps">Noch keine Rundenzeiten.</li>
          </ul>
        </div>
      </section>

      <section id="tab-timer" class="tab-panel">
        <div class="tile-stack">
          <div class="empty-state" data-i18n="timer.empty">Noch keine Timer. Tippe auf + zum Hinzufügen.</div>
          <button type="button" class="tile tile-add" data-i18n-aria-label="timer.add">+</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" role="tablist">
      <button type="button" class="nav-item is-active" data-tab="alarm" role="tab" aria-selected="true">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20a7 7 0 1 0 0-14 7 7 0 0 0 0 14Zm1-11v4.4l3.5 2.1-.75 1.3L11 14V9h2ZM7.4 3.4 3.4 6.9 4.7 8.4l4-3.5-1.3-1.5Zm9.2 0-1.3 1.5 4 3.5 1.3-1.5-4-3.5Z"/></svg>
        <span data-i18n="tabs.alarm">Wecker</span>
      </button>
      <button type="button" class="nav-item" data-tab="location-alarm" role="tab" aria-selected="false">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>
        <span data-i18n="tabs.locationAlarm">Orts-Zeit-Wecker</span>
      </button>
      <button type="button" class="nav-item" data-tab="stopwatch" role="tab" aria-selected="false">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M15 1H9v2h6V1Zm-4 13h2V8h-2v6Zm8.03-6.61 1.42-1.42a10.1 10.1 0 0 0-1.42-1.42l-1.42 1.42A9 9 0 1 0 20 15a8.94 8.94 0 0 0-.97-7.61ZM12 20a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"/></svg>
        <span data-i18n="tabs.stopwatch">Stoppuhr</span>
      </button>
      <button type="button" class="nav-item" data-tab="timer" role="tab" aria-selected="false">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M11 8v5l4.2 2.5.8-1.3-3.5-2.1V8H11Zm1-6a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/></svg>
        <span data-i18n="tabs.timer">Timer</span>
      </button>
    </nav>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
